name: Pubblica il sito                      # nome nella scheda Actions

on:                                         # 1. QUANDO PARTE
  push:                                     #    a ogni push...
    branches: ["main"]                      #    ...sul ramo main...
    paths:                                  #    ...solo se cambiano questi file:
      - "site/**"                           #       il sito
      - ".github/workflows/deploy-site.yml" #       o la pipeline stessa
  workflow_dispatch:                        #    oppure a mano (pulsante "Run workflow")

permissions:                                # 2. COSA PUÒ FARE (minimo privilegio)
  contents: read                            #    leggere il codice
  pages: write                              #    pubblicare su Pages
  id-token: write                           #    identificarsi con Pages (OIDC)

concurrency:                                # una pubblicazione alla volta
  group: pages
  cancel-in-progress: false                 #    mai interromperne una a metà

jobs:
  build:                                    # ── JOB 1: la CI ──
    runs-on: ubuntu-latest                  # 3. SU CHE MACCHINA
    defaults:
      run:
        working-directory: site             # 4. i comandi partono da site/ (niente più ENOENT)
    steps:
      - name: Scarica il codice             # 4. porta il codice sulla macchina vuota
        uses: actions/checkout@v4

      - name: Installa Node                 # 4. installa il linguaggio
        uses: actions/setup-node@v4
        with:
          node-version: "22"                #    la stessa versione del mio PC
          cache: npm                        #    tiene in cache le librerie: più veloce
          cache-dependency-path: site/package-lock.json   # dove sta il lock

      - name: Installa le dipendenze        # 5. le librerie, versioni esatte del lock
        run: npm ci

      - name: Esegui i test                 # 5. CONTROLLO: se fallisce, tutto si ferma qui
        run: npm test

      - name: Costruisci il sito            # 5. crea site/dist
        run: npm run build

      - name: Prepara GitHub Pages          # 6. prepara la consegna
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto            # 6. impacchetta il sito pronto e lo mette nel deposito
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist                   #    dalla radice: working-directory vale solo per i run

  deploy:                                   # ── JOB 2: la CD ──
    needs: build                            # 7. parte SOLO se build è verde
    runs-on: ubuntu-latest
    environment:
      name: github-pages                    #    l'ambiente di destinazione
      url: ${{ steps.deployment.outputs.page_url }}   # l'indirizzo del sito, mostrato in Actions
    steps:
      - name: Pubblica su GitHub Pages      # 7. prende il pacco dal deposito e lo pubblica
        id: deployment                      #    nome del passo, usato dall'url qui sopra
        uses: actions/deploy-pages@v5