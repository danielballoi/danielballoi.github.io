name: Pubblica il sito

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegui i test
        run: npm test

      - name: Costruisci il sito
        run: npm run build

      - name: Prepara GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto            # 6. impacchetta il sito pronto e lo mette nel deposito
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5